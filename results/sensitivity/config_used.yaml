experiment:
  seeds: 50
  seed_offset: 0
  base_config: configs/baseline.yaml
  output: results/sensitivity
  blocks:
  - name: decay_and_penalty
    overrides:
      strategy:
        name: freshness_conflict
    grid:
      network.latency:
      - 0
      - 2
      - 4
      - 8
      strategy.lam:
      - 0.0
      - 0.025
      - 0.05
      - 0.1
      - 0.2
      - 0.4
      strategy.delta:
      - 0.0
      - 0.5
      - 1.0
  - name: no_consolidation
    overrides:
      memory:
        consolidate: false
    grid:
      network.latency:
      - 0
      - 2
      - 4
      - 8
      strategy.name:
      - fifo
      - confidence
      - freshness
      - freshness_conflict
  - name: beacon_noise
    overrides: {}
    grid:
      network.latency:
      - 0
      - 2
      - 4
      - 8
      strategy.name:
      - fifo
      - confidence
      - freshness
      - freshness_conflict
      world.beacon_noise:
      - 0.0
      - 0.1
      - 0.3
resolved_base:
  world:
    n_rooms: 6
    p_move: 0.1
    beacon_interval: 3
    beacon_noise: 0.1
    max_steps: 50
  observer:
    sight_confidence: 0.99
    beacon_confidence: 0.8
  memory:
    consolidate: true
    max_confidence: 0.99
    rehearsal_interval: 1
  network:
    latency: 0
    jitter_frac: 0.5
  strategy:
    name: freshness_conflict
    form: multiplicative
    lam: 0.1
    delta: 0.5
    tau: 0.9
  self_monitor:
    hazard: 0.1
    stale_threshold: 0.5
    conflict_min_confidence: 0.5
    unknown_confidence: 0.9
