experiment:
  seeds: 50
  seed_offset: 0
  base_config: configs/baseline.yaml
  overrides: {}
  latency:
  - 0
  - 2
  - 4
  - 8
  volatility:
    low:
      p_key: 0.05
      p_exit: 0.02
      p_block: 0.05
    high:
      p_key: 0.2
      p_exit: 0.05
      p_block: 0.2
  observation_error_probability:
  - 0.1
  - 0.3
  strategies:
  - fifo
  - confidence
  - freshness
  - freshness_conflict
  - reliability
  tuned_coefficients: results/phase2/multi_source/tuned_coefficients.yaml
  world:
    n_rooms: 8
    max_steps: 80
  output: results/phase2/complex_environment
resolved_base:
  world:
    n_rooms: 6
    p_move: 0.1
    beacon_interval: 3
    beacon_noise: 0.1
    max_steps: 50
  observer:
    sight_confidence: 0.99
    beacon_confidence: 0.8
  memory:
    consolidate: true
    max_confidence: 0.99
    rehearsal_interval: 1
  network:
    latency: 0
    jitter_frac: 0.5
  strategy:
    name: freshness_conflict
    form: multiplicative
    lam: 0.1
    delta: 0.5
    tau: 0.9
  self_monitor:
    hazard: 0.1
    stale_threshold: 0.5
    conflict_min_confidence: 0.5
    unknown_confidence: 0.9
reliability_coefficients:
  w_r: 0.0
  w_c: 1.0
  w_a: 0.1
  w_g: 0.5
