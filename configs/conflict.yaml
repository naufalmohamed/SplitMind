# Experiment 2: controlled conflicting information.
strategies: [fifo, confidence, freshness, freshness_conflict]
output: results/conflict

# Part A: one-shot arbitration of one fresh vs one older, contradicting message.
oneshot:
  now: 20
  fresh_confidence: [0.5, 0.6, 0.7, 0.8, 0.9, 0.95, 0.99]
  old_confidence: [0.5, 0.6, 0.7, 0.8, 0.9, 0.95, 0.99]
  old_age: [1, 2, 5, 10, 20]
  fresh_relevance: [1.0, 0.5]
  fresh_source: [observer, memory]
  arrival: [fresh_last, old_last]
  family: [world_changed, fresh_error]

# Part B: closed-loop episodes that start with a scripted contradiction.
closed_loop:
  seeds: 20
  seed_offset: 0
  base_config: configs/baseline.yaml
  overrides:
    world: {p_move: 0.0, beacon_noise: 0.0}   # no further world events after the contradiction
  latency: [2]
  fresh_confidence: [0.6, 0.8, 0.95]
  old_confidence: [0.6, 0.8, 0.99]
  old_age: [1, 5, 10, 20]
  family: [world_changed, fresh_error]
