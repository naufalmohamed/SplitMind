# Phase 2E: multi-fact ring world (key, exit, blocked corridor), confirmatory grid fixed before running.
# The reliability-aware strategy uses the coefficients tuned in Phase 2B (results/phase2/multi_source/
# tuned_coefficients.yaml); its only source is the single Observer (assumed reliability 0.8).
seeds: 50
seed_offset: 0
base_config: configs/baseline.yaml
overrides: {}
latency: [0, 2, 4, 8]
volatility:
  low:  {p_key: 0.05, p_exit: 0.02, p_block: 0.05}
  high: {p_key: 0.20, p_exit: 0.05, p_block: 0.20}
observation_error_probability: [0.1, 0.3]
strategies: [fifo, confidence, freshness, freshness_conflict, reliability]
tuned_coefficients: results/phase2/multi_source/tuned_coefficients.yaml
world: {n_rooms: 8, max_steps: 80}
output: results/phase2/complex_environment
